<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embed demo</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #1D2636; background: #fff; }
    main { max-width: 1200px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p { color: #64708A; margin: 0 0 24px; }
    .after { margin-top: 24px; padding: 20px; background: #F5F7FA; border-radius: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Host page</h1>
    <p>Stand-in for your website. The dashboard below should fit with no inner scrollbar or gap.</p>

    <!-- ===== Embed snippet: copy from here (use the dashboard's full address on another site) ===== -->
    <iframe
      src="/?embed=1"
      title="Data Beyond sample dashboard"
      style="display:block; width:100%; height:1550px; border:0; border-radius:16px; background:#F5F7FA;">
    </iframe>
    <script src="/assets/embed-host.js"></script>
    <!-- ===== to here ===== -->

    <div class="after">Content after the dashboard sits directly below it.</div>
  </main>
</body>
</html>
